<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Filing Desk, The Mutual Fun</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=Libre+Caslon+Text:wght@400;700&family=Source+Serif+4:wght@400;600&display=swap">
<style>
:root{--paper:#F6EFE3;--ink:#211B14;--ox:#7A2E2E;--gold:#D4AF37;--card:#FBF7EE;--rule:#d9cdb8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1B1610;--ink:#F1E8D8;--card:#2A231A;--rule:#4a3f30;--ox:#B5595A}}
:root[data-theme="dark"]{--paper:#1B1610;--ink:#F1E8D8;--card:#2A231A;--rule:#4a3f30;--ox:#B5595A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.55 "Source Serif 4",Georgia,serif}
main{max-width:640px;margin:0 auto;padding:28px 16px 40px}
h1{font:700 32px/1.15 "Libre Caslon Text",Georgia,serif;margin:0 0 6px}
.lede{margin:0 0 18px}
.bar{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);padding:8px 0;margin-bottom:16px;font-variant:small-caps;letter-spacing:.08em}
.bar b{font:400 18px "IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(max-width:480px){.grid{grid-template-columns:repeat(4,1fr)}}
.c{aspect-ratio:3/4;perspective:600px;border:0;padding:0;background:none;cursor:pointer;font:inherit;color:inherit}
.c:focus-visible{outline:3px solid var(--ox);outline-offset:2px}
.in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.c.up .in{transform:rotateY(180deg)}
.f,.k{position:absolute;inset:0;backface-visibility:hidden;border:2px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.k{background:var(--card);color:var(--ox);font:700 20px "Libre Caslon Text",Georgia,serif;letter-spacing:.12em;box-shadow:inset 0 0 0 4px var(--card),inset 0 0 0 5px var(--ox)}
.f{transform:rotateY(180deg);background:var(--card);padding:4px}
.f img{width:100%;image-rendering:pixelated;image-rendering:crisp-edges;border:3px solid var(--fc)}
.f span{font:700 11px/1.2 "Libre Caslon Text",Georgia,serif;margin-top:4px;text-align:center}
.done .f{border-color:var(--fc);box-shadow:0 0 0 2px var(--fc)}
.done{cursor:default}
#note{min-height:5.5em;margin:18px 0 10px;border-left:4px solid var(--ox);padding:2px 0 2px 12px}
#note i{display:block;font-size:15px;opacity:.8}
button.go{font:600 16px "Source Serif 4",Georgia,serif;background:var(--ox);color:#F6EFE3;border:0;padding:10px 18px;cursor:pointer}
button.go:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.stamp{display:none;margin-top:18px;border:3px solid var(--ox);color:var(--ox);padding:10px 14px;font:700 18px "Libre Caslon Text",Georgia,serif;text-align:center;transform:rotate(-2deg)}
.stamp.on{display:block}
.board{position:relative}
.over{position:absolute;inset:-6px;display:flex;align-items:center;justify-content:center;background:rgba(33,27,20,.74);z-index:5;padding:10px;animation:fin .3s}
.over[hidden]{display:none}
@keyframes fin{from{opacity:0}to{opacity:1}}
.fbox{background:var(--paper);border:3px solid var(--ox);padding:18px 20px;text-align:center;max-width:320px;transform:rotate(-2deg);box-shadow:0 0 0 6px var(--paper)}
.fbox b{display:block;font:700 34px "Libre Caslon Text",Georgia,serif;letter-spacing:.24em;color:var(--ox)}
.fbox small{display:block;margin:8px 0 14px;font-size:16px;line-height:1.4}
.stamp.fail{background:var(--ox);color:#F6EFE3;font-size:28px;letter-spacing:.24em;padding:14px;transform:rotate(-3deg)}
.stamp small{display:block;font:400 15px/1.4 "Source Serif 4",Georgia,serif;letter-spacing:0;margin-top:6px}
@keyframes shuf{0%{transform:none}30%{transform:translate(var(--dx),var(--dy)) rotate(var(--dr))}65%{transform:translate(calc(var(--dx)*-1),calc(var(--dy)*-.6)) rotate(calc(var(--dr)*-1))}100%{transform:none}}
.c.shuf{animation:shuf .75s ease-in-out;pointer-events:none}
button.go.alt{background:transparent;color:var(--ink);border:1px solid var(--ink)}
button.go:active{transform:translateY(1px)}
@media(prefers-reduced-motion:reduce){.in{transition:none}.c.shuf{animation:none}}

*{-webkit-tap-highlight-color:transparent}
.c,button.go{touch-action:manipulation;-webkit-user-select:none;user-select:none}
button.go{min-height:48px}
.grid{gap:10px}
main{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
@media(max-width:480px){
  body{font-size:18px}
  main{padding-top:22px;padding-bottom:48px}
  h1{font-size:30px}
  .lede{margin-bottom:20px}
  .bar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;padding:12px 0;margin-bottom:22px;font-size:13px}
  .bar b{display:block;font-size:22px;margin-top:2px}
  .grid{gap:12px 10px}
  .f span{font-size:10px}
  .k{font-size:17px}
  #note{margin:26px 0 18px;font-size:18px}
  button.go{display:block;width:100%;min-height:54px;font-size:18px;margin:12px 0 0}
  .fbox{padding:22px 18px}
  .fbox b{font-size:30px}
  .fbox button.go{margin-top:6px}
  .stamp{margin-top:24px;font-size:19px;padding:14px}
}
</style></head><body><main>
<h1>The Filing Desk</h1>
<p class="lede">Five levels. Each one is harder than the last, with fewer misses and less time to look. Match two cards of the same fund. Remember where everything is.</p>
<div class="bar"><span>Level <b id="l">1</b></span><span>Misses left <b id="m">0</b></span><span>Filed <b id="p">0</b></span><span>Cleared <b id="b">0</b></span></div>
<div class="board"><div class="grid" id="g"></div><div class="over" id="fo" role="alert" hidden><div class="fbox"><b>FAILED</b><small id="fm"></small><button class="go" id="ta">Try again</button></div></div></div>
<div id="note">Nobody is filed yet.</div>
<button class="go" id="r">Shuffle the desk</button> <button class="go alt" id="mu" aria-pressed="false">Sound on</button>
<div class="stamp" id="s"></div>
<p><button class="go" id="n" style="display:none">Next level</button></p>
</main>

var F=[
["The Argon Fund","#49698C","Noble, inert, and unmoved by the news."],
["The Bogle Fund","#4E8A5A","Buys the whole haystack."],
["The Midas Fund","#B9902F","Everything it touches, marked to gold."],
["The Smaug Fund","#9C5248","Sleeps on the pile and knows every coin in it."],
["The Vladd Fund","#6E5D8C","Buys when there is blood in the streets."]];
var LV=[[2,5,800,0],[4,9,700,0],[4,8,650,3],[4,7,600,2],[4,6,550,2]].map(function(a,i){
  return{c:a[0],m:a[1],d:a[2],r:a[3],t:"Level "+(i+1)+". "+a[0]*5+" cards, "+a[1]+" misses allowed."+(a[0]==4?" Each fund appears four times.":"")+(a[3]?" After every "+(a[3]==2?"second":"third")+" miss the desk moves the unfiled cards.":"")}});
var lv=0,first=null,lock=false,misses=0,left=0,filed=0,pairs=0,busy=false,best=0;
var g=document.getElementById("g"),note=document.getElementById("note"),st=document.getElementById("s"),nx=document.getElementById("n"),ta=document.getElementById("ta"),fo=document.getElementById("fo");
try{best=parseInt(localStorage.getItem("tmf-cleared"))||0}catch(e){}
var ctx=null,muted=false;
function tone(fs,dur,gap){if(muted)return;try{
  ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();
  fs.forEach(function(f,i){var o=ctx.createOscillator(),gn=ctx.createGain(),t0=ctx.currentTime+i*gap;
    o.type="sine";o.frequency.value=f;gn.gain.setValueAtTime(0.0001,t0);
    gn.gain.exponentialRampToValueAtTime(0.22,t0+0.02);gn.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(gn);gn.connect(ctx.destination);o.start(t0);o.stop(t0+dur+0.05)});}catch(e){}}
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
function say(a,b){note.innerHTML=a+(b?"<i>"+b+"</i>":"")}
function bar(){document.getElementById("l").textContent=lv+1;document.getElementById("m").textContent=left;
  document.getElementById("p").textContent=filed+"/"+pairs;document.getElementById("b").textContent=best+"/"+LV.length}
function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}
function clearStamp(){st.className="stamp";nx.style.display="none";fo.hidden=true}
function deal(){
  var L=LV[lv];g.innerHTML="";first=null;lock=false;misses=0;filed=0;left=L.m;pairs=L.c*5/2;clearStamp();
  var d=[];for(var k=0;k<5;k++)for(var c=0;c<L.c;c++)d.push(k);
  shuf(d).forEach(function(k){
    var b=document.createElement("button");b.className="c";b.type="button";b.setAttribute("aria-label","Face down card");
    b.style.setProperty("--fc",F[k][1]);b.dataset.k=k;
    b.innerHTML='<div class="in"><div class="k">TMF</div><div class="f"><img alt="'+F[k][0]+'" src="'+IM[k]+'"><span>'+F[k][0]+'</span></div></div>';
    b.onclick=function(){flip(b)};g.appendChild(b)});
  bar();say(L.t);
}
function flip(b){
  if(lock||b.classList.contains("up"))return;
  b.classList.add("up");
  if(!first){first=b;return}
  var a=first,L=LV[lv];first=null;
  if(a.dataset.k===b.dataset.k){
    a.classList.add("done");b.classList.add("done");filed++;bar();
    var f=F[+b.dataset.k];say(f[0]+" is filed.",f[2]);
    if(filed===pairs)win();else{tone([659.25,880],0.4,0.09);buzz(25)}
    return;
  }
  misses++;left--;bar();lock=true;
  if(left<=0){
    say("Misses spent.","Try again, or shuffle the desk to restart this level.");
    
    setTimeout(function(){a.classList.remove("up");b.classList.remove("up");
      if(left<=0){document.getElementById("fm").textContent="Level "+(lv+1)+" not filed. The desk will wait. Try again.";fo.hidden=false;ta.focus()}},900);return;
  }
  say("Not a pair.",left+(left===1?" miss":" misses")+" left.");
  setTimeout(function(){
    a.classList.remove("up");b.classList.remove("up");
    if(L.r&&misses%L.r===0){
      say("The desk moved the unfiled cards.","Positions you memorised are no longer good.");
      setTimeout(function(){round(null,true);setTimeout(function(){lock=false},650)},250);
    }else lock=false;
  },L.d);
}
function win(){
  lock=true;tone([523.25,659.25,783.99,1046.5],0.5,0.12);buzz([40,60,40]);
  if(lv+1>best){best=lv+1;try{localStorage.setItem("tmf-cleared",best)}catch(e){}}
  bar();
  if(lv<LV.length-1){st.textContent="Level "+(lv+1)+" filed, "+left+" misses to spare.";nx.style.display="inline-block";say("Level cleared.","The next one is larger.")}
  else{st.textContent="All five levels filed, "+left+" misses to spare.";say("The desk is clear.","Shuffle it to file again.")}
  st.className="stamp on";
}
function round(init,partial){
  var all=Array.prototype.slice.call(g.children);
  var sub=partial?all.filter(function(e){return !e.classList.contains("done")}):all.slice();
  var old=sub.slice(),idx=sub.map(function(e){return all.indexOf(e)}),
      before=all.map(function(e){return e.getBoundingClientRect()}),ok=false,n=0;
  while(!ok&&n++<1000){
    shuf(sub);
    ok=sub.every(function(e,k){return e.dataset.k!==old[k].dataset.k&&(!init||e.dataset.k!==init[idx[k]])});
  }
  var map=new Map();all.forEach(function(e,k){map.set(e,before[k])});
  var out=all.slice();idx.forEach(function(p,k){out[p]=sub[k]});
  out.forEach(function(e){g.appendChild(e)});
  sub.forEach(function(e){
    var a=map.get(e),b=e.getBoundingClientRect(),dx=a.left-b.left,dy=a.top-b.top,r=(Math.random()*30-15)+"deg";
    if(e.animate)e.animate([{transform:"translate("+dx+"px,"+dy+"px)"},
      {transform:"translate("+(dx/2)+"px,"+(dy/2-18)+"px) rotate("+r+")",offset:.5},
      {transform:"none"}],{duration:520,easing:"ease-in-out"});
  });
}
document.getElementById("r").onclick=function(){
  if(busy)return;busy=true;lock=true;first=null;misses=0;filed=0;left=LV[lv].m;clearStamp();bar();
  say("Shuffling the desk.");
  Array.prototype.forEach.call(g.children,function(c){c.classList.remove("up","done")});
  var still=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  var init=Array.prototype.map.call(g.children,function(c){return c.dataset.k});
  var rounds=still?1:4,k=0;
  function next(){
    if(k++<rounds){round(init,false);setTimeout(next,still?0:600)}
    else{say("Desk shuffled.",LV[lv].t);lock=false;busy=false}
  }
  setTimeout(next,still?0:450);
};
document.getElementById("mu").onclick=function(){muted=!muted;this.textContent=muted?"Sound off":"Sound on";this.setAttribute("aria-pressed",muted)};
nx.onclick=function(){lv++;deal()};
ta.onclick=function(){deal()};
deal();
